services:
  postgres:
    image: postgres:16-alpine
    container_name: prospection-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospection
      POSTGRES_PASSWORD: prospection
      POSTGRES_DB: prospection
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
